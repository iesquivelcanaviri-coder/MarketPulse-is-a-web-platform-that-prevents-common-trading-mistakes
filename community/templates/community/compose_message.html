{% extends 'base.html' %}

{% block title %}
New Message | MarketPulse
{% endblock %}


{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-sm">

                <div class="card-header bg-white">

                    <h5 class="mb-0">
                        New Message
                    </h5>

                </div>


                <div class="card-body">

                    <form method="post">

                        {% csrf_token %}


                        {% for field in form %}

                            <div class="mb-3">

                                <label
                                    class="form-label"
                                    for="{{ field.id_for_label }}">

                                    {{ field.label }}

                                </label>


                                {{ field }}


                                {% for error in field.errors %}

                                    <div class="text-danger small">

                                        {{ error }}

                                    </div>

                                {% endfor %}

                            </div>

                        {% endfor %}


                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary">

                                Send Message

                            </button>


                            <a
                                href="{% url 'community:inbox' %}"
                                class="btn btn-outline-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
