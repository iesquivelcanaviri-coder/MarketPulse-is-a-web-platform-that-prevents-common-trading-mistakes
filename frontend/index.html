<!doctype html> <!-- I declare a modern HTML document. -->
<!-- ======================================================== -->
<!-- REACT HTML SHELL: Vite mounts src/main.jsx into #root. -->
<!-- ======================================================== -->
<!-- 1. DOCUMENT CONTAINER -->
<html> <!-- I begin the document's root element. -->
<!-- 2. PAGE METADATA -->
<head> <!-- I begin the metadata section, which is not the visible page content. -->
    <meta charset="UTF-8"> <!-- I specify UTF-8 character encoding. -->
    <meta name="viewport" content="width=device-width,initial-scale=1"> <!-- I match the viewport to the device width and set the initial zoom scale. -->
    <title>MarketPulse React</title> <!-- I set the browser tab title. -->
</head> <!-- I finish the metadata section. -->
<!-- 3. PAGE BODY AND REACT CONTAINER -->
<body> <!-- I begin the page body. -->
    <div id="root"></div> <!-- I provide an empty container that the React entry code can select and render into. -->
    <!-- 4. FRONTEND MODULE ENTRY POINT -->
    <script type="module" src="/src/main.jsx"></script> <!-- I load the frontend entry file as a module through Vite. -->
</body> <!-- I finish the page body. -->
</html> <!-- I finish the HTML document. -->
