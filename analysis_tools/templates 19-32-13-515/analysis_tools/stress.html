{% extends 'base.html' %}<!-- ======================================================== STRESS FORM: strategy/scenario → stress analyzer. -->
{% block title %}Stress Test | MarketPulse{% endblock %}{% block content %}<h1 class="h3">Stress Testing</h1><form method="post">{% csrf_token %}<label>Strategy</label><select class="form-select mb-2" name="strategy">{% for s in strategies %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select><label>Symbol</label><input class="form-control mb-2" name="symbol" value="AAPL"><label>Scenario</label><select class="form-select mb-2" name="test_type"><option value="crash">Market Crash</option><option value="volatility_spike">Volatility Spike</option><option value="liquidity_crisis">Liquidity Crisis</option><option value="regime_change">Regime Change</option></select><button class="btn btn-primary">Run Stress Test</button></form>{% endblock %}
