{% extends "base.html" %}


{% block title %}
Password Changed | MarketPulse
{% endblock %}


{% block content %}

<div class="row justify-content-center py-5">

    <div class="col-md-7 col-lg-5">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4 text-center">


                <i
                    class="
                        fa-solid
                        fa-circle-check
                        text-success
                        fs-2
                        mb-3
                    "
                ></i>


                <h1 class="h3">
                    Password Updated
                </h1>


                <p class="text-muted">

                    Your MarketPulse password has been
                    changed successfully.

                    You can now sign in using your new
                    password.

                </p>


                <a
                    href="{% url 'accounts:login' %}"
                    class="btn btn-primary"
                >
                    Sign In
                </a>


            </div>

        </div>

    </div>

</div>

{% endblock %}
