# ============================================================
# RENDER BLUEPRINT - SECRETS ARE SET IN RENDER, NOT GITHUB
# ============================================================
services:
  - type: web
    name: marketpulse
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn marketpulse.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
